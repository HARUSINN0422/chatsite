<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><meta name="description" content="Raspberry Pi上のNode.jsで動く軽量チャット">
<link rel="manifest" href="./manifest.json"><title>ChatSite</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#141b2e;--line:#29334c;--accent:#7c9cff;--text:#eef2ff;--muted:#9aa7c2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,sans-serif}button,input,textarea{font:inherit}button{border:0;border-radius:10px;background:var(--accent);color:#081126;padding:10px 14px;font-weight:650;cursor:pointer}button:disabled{opacity:.45;cursor:default}.secondary{background:#26314b;color:var(--text)}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px max(16px,calc((100% - 900px)/2));border-bottom:1px solid var(--line);background:#0d1426;position:sticky;top:0;z-index:2}header h1{font-size:19px;margin:0}main{max-width:900px;margin:auto;padding:18px 14px 130px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}.center{text-align:center;margin:7vh auto;max-width:420px}.muted{color:var(--muted)}.hidden{display:none!important}#messages{display:flex;flex-direction:column;gap:12px;margin:16px 0}.msg{padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:min(100%,680px);overflow-wrap:anywhere}.msg.mine{align-self:flex-end;background:#1b2a4b}.meta{font-size:12px;color:var(--muted);margin-bottom:5px;display:flex;gap:8px;flex-wrap:wrap}.msg img{display:block;max-width:100%;max-height:420px;border-radius:10px;margin-top:8px}.composer{position:fixed;bottom:0;left:0;right:0;background:#0d1426;border-top:1px solid var(--line);padding:12px max(12px,calc((100% - 900px)/2));z-index:3}.compose-row{display:flex;gap:8px;align-items:flex-end}.compose-row textarea{flex:1;resize:vertical;min-height:44px;max-height:140px;background:#111a2e;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px}.small{font-size:12px}.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.status{margin:10px 0;color:var(--muted);font-size:13px}a{color:#9db5ff}input[type=text],input[type=password]{display:block;width:100%;margin:8px 0 14px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#0d1426;color:var(--text)}label.field{display:block;text-align:left;font-size:13px;color:var(--muted)}.auth-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
</style>
</head>
<body>
<header><h1>ChatSite</h1><div class="top-actions"><span id="userLabel" class="small muted"></span><button id="notifyButton" class="secondary hidden" type="button">通知を有効化</button><button id="signOut" class="secondary hidden" type="button">ログアウト</button></div></header>
<main>
<section id="loginPanel" class="panel center">
 <h2 id="authTitle">ログイン</h2>
 <p id="authDescription" class="muted">ユーザー名とパスワードでログインします。</p>
 <form id="authForm">
  <label class="field" for="username">ユーザー名（英数字、_、-／3〜24文字）</label>
  <input id="username" name="username" type="text" minlength="3" maxlength="24" autocomplete="username" required>
  <label class="field" for="password">パスワード（8〜128文字）</label>
  <input id="password" name="password" type="password" minlength="8" maxlength="128" autocomplete="current-password" required>
  <button id="authSubmit" type="submit" block>ログイン</button>
 </form>
 <div class="auth-actions" style="margin-top:12px"><button id="toggleAuth" class="secondary" type="button">新規アカウントを作成</button></div>
 <p id="loginError" class="status" role="status"></p>
 <p class="muted small">アカウント情報とメッセージはRaspberry Piに保存されます。</p>
</section>
<section id="chat" class="hidden">
 <div class="panel"><strong>全体チャット</strong><div class="muted small">テキストと写真はRaspberry Piに保存されます。写真は保存から3日経過すると自動削除されます。</div></div>
 <div id="status" class="status">接続中…</div><div id="messages" aria-live="polite"></div>
</section>
</main>
<form id="composer" class="composer hidden"><div class="compose-row"><label for="photo" class="secondary" style="padding:10px 12px;border-radius:10px;cursor:pointer;white-space:nowrap">写真<input id="photo" type="file" accept="image/jpeg,image/png,image/gif,image/webp,image/avif" hidden></label><textarea id="messageText" placeholder="メッセージを書く…" maxlength="4000" aria-label="メッセージ"></textarea><button id="send" type="submit">送信</button></div><div id="photoName" class="small muted"></div><div class="small muted">写真は10MB以下。保存から3日後に自動削除されます。</div></form>
<script>
const $ = id => document.getElementById(id);
let currentUser = null, pollTimer = null, selectedPhoto = null, registerMode = false;
function setStatus(s){$("status").textContent=s}
async function api(url, options={}) {
 const headers={...(options.headers||{})};
 if(options.body && !(options.body instanceof FormData)) headers["Content-Type"]="application/json";
 const res=await fetch(url,{credentials:"same-origin",...options,headers});
 const data=await res.json().catch(()=>({}));
 if(!res.ok) throw new Error(data.error||("サーバーエラー ("+res.status+")"));
 return data;
}
function renderMessages(messages){
 $("messages").replaceChildren();
 messages.forEach(m=>{
  const el=document.createElement("article");el.className="msg"+(m.uid===currentUser.uid?" mine":"");
  const meta=document.createElement("div");meta.className="meta";
  meta.textContent=(m.displayName||"ユーザー")+" · "+(m.createdAt?new Date(m.createdAt).toLocaleString():"");el.append(meta);
  if(m.text){const p=document.createElement("div");p.textContent=m.text;el.append(p)}
  if(m.imageUrl){const a=document.createElement("a");a.href=m.imageUrl;a.target="_blank";a.rel="noopener noreferrer";const img=document.createElement("img");img.src=m.imageUrl;img.alt="共有された写真";img.loading="lazy";img.onerror=()=>{a.removeAttribute("href");img.alt="この写真は保存期限を過ぎたため削除されています";img.style.display="none";const note=document.createElement("div");note.className="muted small";note.textContent="写真は保存から3日経過したため削除されています";el.append(note)};a.append(img);el.append(a)}
  $("messages").append(el);
 });
}
async function loadMessages(){
 try{const data=await api("/api/messages");renderMessages(data.messages||[]);setStatus("Raspberry Piに接続中")}
 catch(e){setStatus("メッセージ読み込みエラー: "+e.message)}
}
function showSignedIn(user){
 currentUser=user;$("loginPanel").classList.add("hidden");$("chat").classList.remove("hidden");$("composer").classList.remove("hidden");
 $("userLabel").textContent=user.username;$("signOut").classList.remove("hidden");$("notifyButton").classList.remove("hidden");
 loadMessages();if(pollTimer)clearInterval(pollTimer);pollTimer=setInterval(loadMessages,3000);
}
function showAuth(){
 $("loginPanel").classList.remove("hidden");$("chat").classList.add("hidden");$("composer").classList.add("hidden");
 $("signOut").classList.add("hidden");$("notifyButton").classList.add("hidden");$("userLabel").textContent="";
 $("authTitle").textContent=registerMode?"アカウント作成":"ログイン";
 $("authDescription").textContent=registerMode?"ユーザー名とパスワードを決めてアカウントを作成します。":"ユーザー名とパスワードでログインします。";
 $("authSubmit").textContent=registerMode?"アカウントを作成":"ログイン";
 $("toggleAuth").textContent=registerMode?"ログイン画面に戻る":"新規アカウントを作成";
 $("password").autocomplete=registerMode?"new-password":"current-password";
}
function urlBase64ToUint8Array(base64String){
 const padding="=".repeat((4-base64String.length%4)%4);
 const raw=atob((base64String+padding).replace(/-/g,"+").replace(/_/g,"/"));
 return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
}
async function enableNotifications(){
 const button=$("notifyButton");button.disabled=true;
 try{
  if(!("serviceWorker" in navigator)||!("PushManager" in window)||!("Notification" in window))throw new Error("このブラウザはプッシュ通知に対応していません");
  if(!window.isSecureContext)throw new Error("通知にはHTTPS接続が必要です（localhostを除く）");
  if(await Notification.requestPermission()!=="granted")throw new Error("ブラウザの通知許可が必要です");
  const keyRes=await fetch("/api/push/public-key",{cache:"no-store"});const keyData=await keyRes.json();
  if(!keyRes.ok||!keyData.publicKey)throw new Error(keyData.error||"サーバー側のVAPID設定が未完了です");
  const registration=await navigator.serviceWorker.register("/sw.js");await navigator.serviceWorker.ready;
  let subscription=await registration.pushManager.getSubscription();
  if(!subscription)subscription=await registration.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(keyData.publicKey)});
  await api("/api/push/subscribe",{method:"POST",body:JSON.stringify({subscription:subscription.toJSON()})});
  button.textContent="通知を有効化済み";setStatus("プッシュ通知を有効にしました");
 }catch(e){setStatus("通知設定エラー: "+e.message)}
 finally{button.disabled=false}
}
async function disableNotifications(){
 try{const registration=await navigator.serviceWorker.getRegistration("/sw.js");const sub=registration&&await registration.pushManager.getSubscription();
  if(sub){await api("/api/push/unsubscribe",{method:"POST",body:JSON.stringify({endpoint:sub.endpoint})});await sub.unsubscribe()}
 }catch(e){console.error(e)}
}
$("authForm").addEventListener("submit",async e=>{
 e.preventDefault();$("authSubmit").disabled=true;$("loginError").textContent="";
 try{
  const username=$("username").value.trim(),password=$("password").value;
  const data=await api(registerMode?"/api/register":"/api/login",{method:"POST",body:JSON.stringify({username,password})});
  $("password").value="";showSignedIn(data.user);
 }catch(err){$("loginError").textContent=err.message}
 finally{$("authSubmit").disabled=false}
});
$("toggleAuth").addEventListener("click",()=>{registerMode=!registerMode;$("loginError").textContent="";showAuth()});
$("notifyButton").addEventListener("click",enableNotifications);
$("signOut").addEventListener("click",async()=>{await disableNotifications();try{await api("/api/logout",{method:"POST"})}catch{}currentUser=null;if(pollTimer)clearInterval(pollTimer);pollTimer=null;registerMode=false;showAuth()});
$("photo").addEventListener("change",e=>{selectedPhoto=e.target.files[0]||null;$("photoName").textContent=selectedPhoto?selectedPhoto.name+" ("+Math.ceil(selectedPhoto.size/1024)+" KB)":""});
$("composer").addEventListener("submit",async e=>{
 e.preventDefault();if(!currentUser)return;
 const text=$("messageText").value.trim(),photo=selectedPhoto;if(!text&&!photo)return;
 $("send").disabled=true;
 try{
  let imageUrl="";
  if(photo){setStatus("Raspberry Piに写真を保存中…");const form=new FormData();form.append("photo",photo);const uploaded=await api("/api/photos",{method:"POST",body:form});imageUrl=uploaded.imageUrl}
  await api("/api/messages",{method:"POST",body:JSON.stringify({text,imageUrl})});
  $("messageText").value="";$("photo").value="";$("photoName").textContent="";selectedPhoto=null;await loadMessages();
 }catch(err){setStatus("送信エラー: "+err.message)}
 finally{$("send").disabled=false}
});
async function init(){
 try{const data=await api("/api/me");showSignedIn(data.user)}
 catch{showAuth()}
}
init();
if("serviceWorker" in navigator && location.protocol!=="file:"){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(console.error))}
</script>
</body></html>
